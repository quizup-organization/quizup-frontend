name: Release
on:
  push:
    branches: [main]
jobs:
  release:
    uses: quizup-organization/quizup-reusable-workflows/.github/workflows/frontend-release.yml@main
    with:
      node-version: "22"
      github-username: ${{ vars.QUIZUP_GITHUB_USERNAME }}
      service-name: frontend
    secrets:
      GITHUB_PASSWORD: ${{ secrets.QUIZUP_GITHUB_TOKEN }}

